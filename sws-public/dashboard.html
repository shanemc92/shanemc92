<style>

      --border: #e3e6ec;
      --border-strong: #cfd4dd;
      --text: #151922;
      --muted: #5a6376;
      --faint: #8a93a6;
      --accent: #0f9f8a;
      --accent-soft: rgba(15, 159, 138, 0.1);
      --accent-2: #4a64d8;
      --pin: #d97706;
      --pin-soft: rgba(217, 119, 6, 0.1);
      --shadow: 0 1px 2px rgba(16,24,40,0.05), 0 8px 24px -14px rgba(16,24,40,0.18);

  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f6f7f9;
    --bg-2: #ffffff;
    --surface: #ffffff;
    --surface-hover: #fbfcfd;
    --border: #e3e6ec;
    --border-strong: #cfd4dd;
    --text: #151922;
    --muted: #5a6376;
    --faint: #8a93a6;
    --accent: #0f9f8a;
    --accent-soft: rgba(15, 159, 138, 0.1);
    --accent-2: #4a64d8;
    --pin: #d97706;
    --pin-soft: rgba(217, 119, 6, 0.1);

  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: saturate(160%) blur(12px);
    -webkit-backdrop-filter: saturate(160%) blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .topbar-inner, main, footer {
    max-width: 1600px;
    margin: 0 auto;
    padding-left: clamp(1rem, 3vw, 2.5rem);
    padding-right: clamp(1rem, 3vw, 2.5rem);
  }
  .topbar-inner {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    height: 64px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    font-family: var(--mono);
    font-weight: 600;
    font-size: 15px;
    color: var(--text);
    text-decoration: none;
    white-space: nowrap;
  }
  .brand-mark {
    width: 10px; height: 10px;
    border-radius: 3px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 12px var(--accent-soft);
  }
  .brand span:last-child { color: var(--muted); font-weight: 400; }

  .search {
    flex: 1;
    min-width: 0;
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    height: 40px;
    padding: 0 0.75rem;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .search svg { flex-shrink: 0; color: var(--faint); }
  .search input {
    flex: 1; min-width: 0;
    background: transparent; border: 0;
    color: var(--text); font: inherit;
  }
  .search input:focus { outline: none; }
  .search input::placeholder { color: var(--faint); }
  .search input::-webkit-search-cancel-button { display: none; }

  kbd {
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1;
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0.2em 0.45em;
  }

  .icon-btn {
    display: grid;
    place-items: center;
    width: 36px; height: 36px;
    flex-shrink: 0;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 9px;
    color: var(--muted);
    cursor: pointer;
  }
  .icon-btn:hover { color: var(--text); background: var(--surface); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .icon-btn svg { display: none; }
  :root:not([data-theme]) .icon-btn .i-system,
  :root[data-theme="light"] .icon-btn .i-light,
  :root[data-theme="dark"] .icon-btn .i-dark { display: block; }
  .topbar-actions { display: flex; align-items: center; gap: 0.5rem; }

  .nav-link {
    color: var(--muted);
    text-decoration: none;
    font-size: 13.5px;
    white-space: nowrap;
    padding: 0.4rem 0.7rem;
    border-radius: 8px;
  }
  .nav-link:hover, .nav-link:focus-visible { color: var(--text); background: var(--surface); outline: none; }

  main { padding-top: 1.5rem; padding-bottom: 2rem; }

  /* Sections */
  .group + .group { margin-top: 2rem; }
  .group > summary {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.3rem 0.55rem 0.3rem 0.35rem;
    margin: 0 0 0.85rem -0.35rem;
    border-radius: 8px;
    cursor: pointer;
    list-style: none;
    user-select: none;
  }
  .group > summary::-webkit-details-marker { display: none; }
  .group > summary::before {
    content: '';
    width: 7px; height: 7px;
    border-right: 1.5px solid var(--faint);
    border-bottom: 1.5px solid var(--faint);
    transform: rotate(-45deg);
    margin: 0 0.25rem 0 0.2rem;
    transition: transform 0.15s ease;
  }
  .group[open] > summary::before { transform: rotate(45deg) translate(-2px, -2px); }
  .group > summary:hover { background: var(--surface); }
  .group > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .group:not([open]) > summary { margin-bottom: 0; }

  h2 {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h2 .count {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0;
    font-weight: 500;
    color: var(--faint);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.05rem 0.5rem;
  }
  #h-pinned .label { color: var(--pin); }
  .pin-empty {
    color: var(--muted);
    font-size: 13.5px;
    padding: 1rem 1.1rem;
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius);
    margin-bottom: 0.5rem;
  }

  /* Cards */
  .grid {
    list-style: none;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 0.9rem;
  }
  .card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    transition: border-color 0.15s, transform 0.15s, background 0.15s;
  }
  .card:hover { border-color: var(--border-strong); background: var(--surface-hover); transform: translateY(-2px); }
  .card:focus-within { border-color: var(--accent); }
  .card.pinned { border-color: color-mix(in srgb, var(--pin) 35%, var(--border)); }
  .card.pinned:hover { border-color: color-mix(in srgb, var(--pin) 60%, var(--border)); }
  .card a {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    height: 100%;
    padding: 1.05rem 1.15rem 1.1rem;
    color: inherit;
    text-decoration: none;
    border-radius: var(--radius);
  }
  .card a:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--accent-soft); }
  .card-head { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; min-height: 2rem; margin-top: -0.3rem; padding-right: 2.2rem; }
  .name {
    font-family: var(--mono);
    font-weight: 600;
    font-size: 14.5px;
    letter-spacing: -0.01em;
  }
  .card a:hover .name, .card a:focus-visible .name { color: var(--accent); }
  .chip {
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.05rem 0.5rem;
    text-transform: lowercase;
  }
  .card-head kbd { margin-left: auto; }
  .what { font-size: 14px; color: var(--text); }
  .when { margin-top: auto; font-size: 13px; color: var(--muted); }
  .when b {
    display: block;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent-2);
    margin-bottom: 0.1rem;
  }

  .pin {
    position: absolute;
    top: 0.7rem; right: 0.7rem;
    width: 2rem; height: 2rem;
    display: grid; place-items: center;
    background: transparent;
    border: 0;
    border-radius: 8px;
    color: var(--faint);
    font-size: 16px; line-height: 1;
    cursor: pointer;
    transition: color 0.15s, background 0.15s;
  }
  .pin:hover { color: var(--pin); background: var(--pin-soft); }
  .pin:focus-visible { outline: 2px solid var(--accent); }
  .pin[aria-pressed="true"] { color: var(--pin); }

  .empty { color: var(--muted); text-align: center; padding: 3rem 1rem; }

  footer {
    padding-top: 1.25rem;
    padding-bottom: 2rem;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 0.75rem 2rem;
    color: var(--faint);
    font-size: 12.5px;
  }
  footer { border-top: 1px solid var(--border); }
  .shortcuts { display: flex; flex-wrap: wrap; gap: 0.4rem 1.1rem; align-items: center; }
  .shortcuts span { display: inline-flex; gap: 0.3rem; align-items: center; }
  footer a { color: var(--faint); }
  footer a:hover, footer a:focus-visible { color: var(--accent); }

  [hidden] { display: none !important; }
  /* Set for one frame while switching theme so cards don't fade through grey */
  .no-transitions *, .no-transitions *::before { transition: none !important; }

  @media (max-width: 640px) {
    .topbar-inner { gap: 0.75rem; height: 58px; }
    .nav-link { padding: 0.4rem; }
    .brand span:last-child, .nav-link .long, .search kbd, .card-head kbd, .shortcuts { display: none; }
    .grid { grid-template-columns: 1fr; }
    .card:hover { transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before { transition: none !important; }
    .card:hover { transform: none; }
  }
</style>

      what: 'Nine compartments between you and the flag. Each is a different trick, and none is visible in the source until opened.',
      when: 'you want a puzzle, not a tool',
      tags: 'ctf puzzle flag game' },
    { id: 'break-glass', group: 'games', href: './break-glass/',
      what: 'Incident response tabletop simulator. Pick the right actions to resolve the incident while limiting damage.',
      when: 'running a workshop or practising IR decisions',
      tags: 'incident response tabletop simulator game' },

    { id: 'motd-stats', group: 'scripts', href: 'https://github.com/shanemc92/motd-stats', external: true,
      what: 'SSH login banner with server stats: failed units, reboot-required, fail2ban bans, last apt update, swap.',
      when: 'setting up a new Linux box',
      tags: 'ssh banner server stats linux motd' },
    { id: 'debian-harden', group: 'scripts', href: 'https://github.com/shanemc92/debian-harden', external: true,
      what: 'Interactive hardening: sudo user and SSH keys, sshd, UFW, fail2ban, sysctl, unattended-upgrades.',
      when: 'a fresh Debian or Pi install goes online',
      tags: 'hardening debian ssh ufw fail2ban linux raspberry pi' },
    { id: 'powershell-automate', group: 'scripts', href: 'https://github.com/shanemc92/powershell-automate', external: true,
      what: 'Windows script scheduler with a shared function library, logging, health emails and credential management.',
      when: 'a scheduled Windows script needs a proper home',
      tags: 'powershell windows scheduler automation entra ad' }
  ];

  var STORE_KEY = 'sws-dashboard:pins';
  var byId = {};
  APPS.forEach(function (a) { byId[a.id] = a; });

  // localStorage is shared with every page on this origin, so treat it as untrusted:
  // keep only known ids, drop duplicates, cap the length.
  function loadPins() {
    try {
      var raw = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
      if (!Array.isArray(raw)) return [];
      var seen = {};
      return raw.filter(function (id) {
        if (typeof id !== 'string' || !byId.hasOwnProperty(id) || seen[id]) return false;
        return (seen[id] = true);
      }).slice(0, APPS.length);
    } catch (e) { return []; }
  }
  function savePins() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(pins)); } catch (e) { /* private mode: pins last for the session */ }
  }

  // Collapsed sections: stored as an array of section keys, validated like pins.
  var COLLAPSE_KEY = 'sws-dashboard:collapsed';
  var validSections = { pinned: true };
  GROUPS.forEach(function (g) { validSections[g[0]] = true; });

  function loadCollapsed() {
    var out = {};
    try {
      var raw = JSON.parse(localStorage.getItem(COLLAPSE_KEY) || '[]');
      if (Array.isArray(raw)) raw.forEach(function (k) {
        if (typeof k === 'string' && validSections.hasOwnProperty(k)) out[k] = true;
      });
    } catch (e) { /* bad or missing value: everything expanded */ }
    return out;
  }
  function saveCollapsed() {
    try { localStorage.setItem(COLLAPSE_KEY, JSON.stringify(Object.keys(collapsed))); } catch (e) { /* session only */ }
  }

  // Theme: cycles system -> light -> dark. 'system' is stored as no key.
  var THEME_KEY = 'sws-dashboard:theme';
  var THEMES = ['system', 'light', 'dark'];
  var themeBtn = document.getElementById('theme');

  function currentTheme() {
    var t = document.documentElement.dataset.theme;
    return t === 'light' || t === 'dark' ? t : 'system';
  }
  function nextTheme() { return THEMES[(THEMES.indexOf(currentTheme()) + 1) % THEMES.length]; }
  function applyTheme(t) {
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    else delete document.documentElement.dataset.theme;
    themeBtn.setAttribute('aria-label', 'Theme: ' + currentTheme() + '. Switch to ' + nextTheme() + '.');
    themeBtn.title = 'Theme: ' + currentTheme();
  }
  themeBtn.addEventListener('click', function () {
    var next = nextTheme();
    var root = document.documentElement;
    root.classList.add('no-transitions');
    applyTheme(next);
    requestAnimationFrame(function () { requestAnimationFrame(function () { root.classList.remove('no-transitions'); }); });
    try {
      if (next === 'system') localStorage.removeItem(THEME_KEY);
      else localStorage.setItem(THEME_KEY, next);
    } catch (e) { /* session only */ }
  });
  applyTheme(currentTheme());

  var pins = loadPins();
  var collapsed = loadCollapsed();   // key -> true when closed; missing means open
  var sectionsEl = document.getElementById('sections');
  var q = document.getElementById('q');
  var emptyEl = document.getElementById('empty');

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function card(app, pinIndex) {
    var pinned = pinIndex > -1;
    var li = el('li', 'card' + (pinned ? ' pinned' : ''));
    li.dataset.group = app.group;
    li.dataset.id = app.id;
    li.dataset.hay = (app.id + ' ' + app.what + ' ' + app.when + ' ' + app.tags + ' ' + app.group).toLowerCase();

    var a = el('a');
    a.href = app.href;
    a.target = '_blank';            // every tool opens in a new tab
    a.rel = 'noopener noreferrer';

    var head = el('span', 'card-head');
    head.appendChild(el('span', 'name', app.id));
    if (pinned) head.appendChild(el('span', 'chip', app.group));
    if (app.external) head.appendChild(el('span', 'chip', app.href.indexOf('github.com') > -1 ? 'github ↗' : 'external ↗'));
    if (pinned && pinIndex < 9) {
      var k = el('kbd', null, String(pinIndex + 1));
      k.setAttribute('aria-hidden', 'true');
      head.appendChild(k);
      a.setAttribute('aria-keyshortcuts', String(pinIndex + 1));
    }
    a.appendChild(head);
    a.appendChild(el('span', 'what', app.what));
    var when = el('span', 'when');
    when.appendChild(el('b', null, 'Use when'));
    when.appendChild(document.createTextNode(' ' + app.when));
    a.appendChild(when);
    li.appendChild(a);

    var b = el('button', 'pin', pinned ? '★' : '☆');
    b.type = 'button';
    b.dataset.id = app.id;
    b.setAttribute('aria-pressed', pinned ? 'true' : 'false');
    b.setAttribute('aria-label', (pinned ? 'Unpin ' : 'Pin ') + app.id);
    b.title = pinned ? 'Unpin' : 'Pin to top';
    li.appendChild(b);
    return li;
  }

  function section(key, label, apps, isPinned) {
    var sec = el('details', 'group');
    sec.dataset.key = key;
    sec.open = !collapsed[key];
    var sum = el('summary');
    var h = el('h2');
    h.id = 'h-' + key;
    h.appendChild(el('span', 'label', label));
    h.appendChild(document.createTextNode(' '));
    h.appendChild(el('span', 'count'));
    sum.appendChild(h);
    sec.appendChild(sum);
    // Record user toggles only; while filtering, sections are forced open
    sec.addEventListener('toggle', function () {
      if (filtering()) return;
      if (sec.open) delete collapsed[key]; else collapsed[key] = true;
      saveCollapsed();
    });
    if (isPinned && !apps.length) {
      sec.appendChild(el('p', 'pin-empty', 'Nothing pinned yet. Hit ☆ on any tool to keep it up here, and open the first nine with keys 1-9.'));
    }
    var ul = el('ul', 'grid');
    apps.forEach(function (app) { ul.appendChild(card(app, pins.indexOf(app.id))); });
    sec.appendChild(ul);
    return sec;
  }

  function render(focusId) {
    sectionsEl.textContent = '';
    sectionsEl.appendChild(section('pinned', 'Pinned', pins.map(function (id) { return byId[id]; }), true));
    GROUPS.forEach(function (g) {
      var list = APPS.filter(function (a) { return a.group === g[0] && pins.indexOf(a.id) === -1; });
      if (list.length) sectionsEl.appendChild(section(g[0], g[1], list, false));
    });
    filter();
    if (focusId) {
      var btn = sectionsEl.querySelector('.pin[data-id="' + focusId + '"]');
      if (btn) btn.focus();
    }
  }

  function filtering() { return q.value.trim() !== ''; }

  function filter() {
    var terms = q.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
    var total = 0;
    Array.prototype.forEach.call(sectionsEl.querySelectorAll('.card'), function (c) {
      c.hidden = !terms.every(function (t) { return c.dataset.hay.indexOf(t) !== -1; });
    });
    Array.prototype.forEach.call(sectionsEl.querySelectorAll('.group'), function (g) {
      var n = g.querySelectorAll('.card:not([hidden])').length;
      var isPinned = g.querySelector('#h-pinned');
      g.hidden = terms.length > 0 && n === 0;
      if (isPinned && !terms.length) g.hidden = false;
      // Open everything while a filter is active so matches are never hidden
      var want = terms.length ? true : !collapsed[g.dataset.key];
      if (g.open !== want) g.open = want;
      g.querySelector('.count').textContent = '(' + n + ')';
      total += n;
    });
    emptyEl.hidden = total !== 0;
  }

  function firstVisible() { return sectionsEl.querySelector('.group[open] .card:not([hidden]) a'); }

  function open(a) {
    if (!a) return;
    if (a.target === '_blank') window.open(a.href, '_blank', 'noopener,noreferrer');
    else location.href = a.href;
  }

  sectionsEl.addEventListener('click', function (e) {
    var b = e.target.closest('.pin');
    if (!b) return;
    var id = b.dataset.id;
    if (!byId.hasOwnProperty(id)) return;
    var i = pins.indexOf(id);
    if (i > -1) pins.splice(i, 1); else pins.push(id);
    savePins();
    render(id);
  });

  // Keep pins in sync if the dashboard is open in two tabs
  window.addEventListener('storage', function (e) {
    if (e.key === STORE_KEY) { pins = loadPins(); render(); }
    if (e.key === COLLAPSE_KEY) { collapsed = loadCollapsed(); filter(); }
    if (e.key === THEME_KEY) applyTheme(e.newValue);
  });

  q.addEventListener('input', filter);
  q.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); open(firstVisible()); }
    if (e.key === 'Escape') { q.value = ''; filter(); q.blur(); }
    if (e.key === 'ArrowDown') { var a = firstVisible(); if (a) { e.preventDefault(); a.focus(); } }
  });

  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var typing = document.activeElement === q;
    if (e.key === '/' && !typing) { e.preventDefault(); q.focus(); q.select(); return; }
    if (e.key === 'Escape' && !typing && q.value) { q.value = ''; filter(); return; }
    if (!typing && /^[1-9]$/.test(e.key)) {
      var id = pins[Number(e.key) - 1];
      if (id) open(sectionsEl.querySelector('.card[data-id="' + id + '"] a'));
    }
  });

  render();
})();
</script>
</body>
</html>
