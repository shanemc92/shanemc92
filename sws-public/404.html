<title>404 — zsh</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root {
    --page: #090b10;
    --win: #12151c;
    --win-border: #262b38;
    --titlebar: #181c26;
    --text: #d9dde6;
    --dim: #6b7385;
    --accent: #5eead4;
    --err: #ff6b6b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(255,107,107,0.06), transparent),
      var(--page);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14.5px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 4vh 4vw;
  }

  .window {
    width: 100%;
    max-width: 760px;
    background: var(--win);
    border: 1px solid var(--win-border);
    border-radius: 12px;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.02);
    overflow: hidden;
  }

  .titlebar {
    background: var(--titlebar);
    border-bottom: 1px solid var(--win-border);
    padding: 0.7rem 1rem;
    display: flex;
    align-items: center;
  }

  .dots { display: flex; gap: 0.45rem; }
  .dots span { width: 11px; height: 11px; border-radius: 50%; }
  .dot-red { background: #ff5f57; }
  .dot-yellow { background: #ffbd2e; }
  .dot-green { background: #28c840; }

  .titlebar-label {
    flex: 1;
    text-align: center;
    color: var(--dim);
    font-size: 12.5px;
    margin-right: 3rem;
  }

  .term {
    padding: 1.75rem 1.75rem 2rem;
    line-height: 1.75;
  }

  .prompt { color: var(--accent); }
  .cmd { color: var(--text); }
  .err { color: var(--err); margin: 0.9rem 0 1.5rem; }

  p.hint { color: var(--dim); margin-bottom: 0.5rem; }

  a.home {
    color: var(--text);
    text-decoration: none;
    border-bottom: 1px solid var(--dim);
  }
  a.home:hover, a.home:focus-visible {
    color: var(--accent);
    border-color: var(--accent);
    outline: none;
  }

  .prompt-line { margin-top: 2rem; }

  .cursor {
    display: inline-block;
    width: 7px;
    height: 1em;
    background: var(--accent);
    vertical-align: text-bottom;
    animation: blink 1s steps(1) infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; }
  }
</style>
</head>
<body>
<div class="window">
  <div class="titlebar">
    <div class="dots">
      <span class="dot-red"></span>
      <span class="dot-yellow"></span>
      <span class="dot-green"></span>
    </div>
    <div class="titlebar-label">tools — zsh</div>
  </div>

  <div class="term">
    <div><span class="prompt">~/tools</span> <span class="cmd">❯ cd <span id="reqpath">requested-page</span></span></div>
    <p class="err">zsh: no such file or directory: <span id="reqpath2">requested-page</span></p>

    <p class="hint">nothing's mounted there. head back to <a class="home" href="/">~/tools</a> and pick from what's listed.</p>

    <div class="prompt-line"><span class="prompt">~/tools</span> <span class="cmd">❯</span> <span class="cursor"></span></div>
  </div>
</div>
<script>
  var p = window.location.pathname.replace(/^\/|\/$/g, '');
  if (p) {
    document.getElementById('reqpath').textContent = p;
    document.getElementById('reqpath2').textContent = p;
  }
</script>
</body>
</html>
